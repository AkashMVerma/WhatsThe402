<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WhatsThe402</title>
    <meta name="description" content="How often websites refuse AI agents (403) or ask them to pay (402), month by month and by industry, from Cloudflare Radar data." />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Work+Sans:wght@400;500;600&display=swap" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <a class="brand" href="#" data-view="overview">WhatsThe402</a>
      <label class="month" for="month">
        <span id="month-label"></span>
        <input id="month" type="range" min="0" max="0" step="1" value="0" />
      </label>
      <nav class="tabs" aria-label="Sections">
        <a href="#" data-view="overview">Overview</a>
        <a href="#industries" data-view="industries">Industries</a>
        <a href="#agents" data-view="agents">Agents</a>
        <a href="#method" data-view="method">Method</a>
      </nav>
    </header>

    <main id="main">
      <div id="view-overview" class="view"></div>
      <div id="view-industries" class="view" hidden></div>
      <div id="view-agents" class="view" hidden></div>
      <div id="view-method" class="view" hidden></div>
    </main>

    <footer class="foot">
      <span id="foot-source"></span>
      <span class="foot-actions">
        <button type="button" class="link-btn" id="dl-csv">Download CSV</button>
        <button type="button" class="btn" id="cite">Copy citation</button>
      </span>
    </footer>

    <p class="load-error" id="load-error" hidden></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
